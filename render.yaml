# Render blueprint — API service for Life Tracker.
# Dashboard: New + → Blueprint → repo hassy1122/life-tracker → fill MONGODB_URI → Deploy.

services:
  - type: web
    name: life-tracker-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # paste your MongoDB Atlas connection string (db: lifetracker)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # your Vercel frontend URL, e.g. https://life-tracker-web.vercel.app
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d
